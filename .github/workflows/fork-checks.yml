name: Fork checks
run-name: Fork checks ${{ inputs.label }} @ ${{ inputs.sha }}

# Upstream's ESLint, TypeScript and Jest jobs for a fork commit, merged onto upstream master as a pull
# request is. Start it with `bin/lndev ci BRANCH` in the workspace. The steps come from the merged
# tree's own workflow files (.github/fork-checks/checks.py).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on the fork
        required: true
        type: string
      label:
        description: Branch name, for the run title
        required: false
        type: string
        default: ''
      merge:
        description: Merge the commit onto upstream master first
        required: false
        type: boolean
        default: true
      jest:
        description: all runs every Jest test; related runs the pull request selection
        required: false
        type: choice
        options: [all, related]
        default: all

permissions:
  contents: read

concurrency:
  group: fork-checks-${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'alirafiqmalik/lnreader'
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: ESLint, workflow: lint.yml }
          - { name: TypeScript, workflow: types.yml }
          - { name: Jest, workflow: testing.yml }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: controller
          persist-credentials: false
      - name: Test the runner
        run: python3 controller/.github/fork-checks/test_checks.py
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Merge onto upstream master
        env:
          SHA: ${{ inputs.sha }}
          MERGE: ${{ inputs.merge }}
        run: |
          args=(--repo app --sha "$SHA")
          if [ "$MERGE" != true ]; then args+=(--no-merge); fi
          python3 controller/.github/fork-checks/checks.py merge "${args[@]}"
      - name: Read the upstream job
        id: plan
        env:
          WORKFLOW: ${{ matrix.check.workflow }}
        run: python3 controller/.github/fork-checks/checks.py plan "app/.github/workflows/$WORKFLOW" --output "$RUNNER_TEMP/plan.json"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.plan.outputs.node }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Run the upstream steps
        env:
          JEST: ${{ inputs.jest }}
        run: |
          args=(--cwd app)
          if [ "$JEST" = related ]; then args+=(--event pull_request); fi
          python3 controller/.github/fork-checks/checks.py run "$RUNNER_TEMP/plan.json" "${args[@]}"
